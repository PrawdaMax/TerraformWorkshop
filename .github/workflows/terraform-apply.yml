name: Terraform Apply (create infrastructure)

# Wird nur manuell über "Actions" -> "Run workflow" gestartet.
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform_03

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # AWS-Zugangsdaten aus den GitHub Secrets laden.
      # AWS_SESSION_TOKEN wird nur bei temporären Zugangsdaten
      # (z. B. AWS Academy Learner Lab) benötigt.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      # Installiert Terraform auf dem Runner.
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

      - name: Show load balancer DNS
        run: terraform output load_balancer_dns
